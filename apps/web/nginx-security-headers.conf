# Included by every nginx location that sets its own headers. nginx drops headers inherited
# from the server block as soon as a location uses add_header, so they must be repeated.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# 'unsafe-inline' for styles is needed for sonner's injected <style>. Scripts stay 'self' only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
