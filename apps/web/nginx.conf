server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Don't advertise the nginx version in the Server header or error pages.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: forward to the api container. The browser only talks to this origin, so cookies stay
  # same-site and CORS is not involved. No security headers here: the API (helmet) sets its own,
  # and adding them again would duplicate them.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The API reads these (TRUST_PROXY) to rate-limit the real client, not nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts a content hash in these filenames, so a given URL never changes: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else is the SPA. Unknown paths (/app, /signin on reload) fall back to index.html
  # so React Router can handle them. no-cache = always revalidate, so a deploy shows up at once.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
